# Keep tmux + in-flight CLI sessions alive across service restarts.
#
# The default KillMode=control-group reaps every process in the unit's cgroup —
# including the tmux server the bot spawns, every pane shell, and every
# Claude/Codex/Gemini session mid-turn. socket.js stop() deliberately preserves
# tmux ("tmux sessions preserved"), but systemd swept them anyway
# (incident 2026-06-12: agent-initiated restart killed its own session;
# the lost turn surfaced as "I restarted before finishing your last request").
#
# Apply with:
#   sudo mkdir -p /etc/systemd/system/claude-remote.service.d
#   sudo cp deploy/systemd/claude-remote.service.d/10-killmode.conf \
#        /etc/systemd/system/claude-remote.service.d/10-killmode.conf
#   sudo systemctl daemon-reload
#
# NOTE: with KillMode=process a plain `systemctl stop` intentionally leaves
# tmux and CLI sessions running. For a FULL shutdown follow with:
#   tmux kill-server
[Service]
KillMode=process
