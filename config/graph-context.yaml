# Global default OFF — injection is scoped to the payments channels below.
enabled: false
default_budget_tokens: 4000
default_depth: 2
timeout_ms: 2000

# Per-channel overrides. Channel id → settings. (override.enabled wins over global)
channels:
  C08S954G2LX:                 # payments-incidents
    enabled: true
    budget_tokens: 6000
    depth: 2
  C05RNSE8TBR:                 # payments-cko
    enabled: true
  CUV9EAYGY:                   # payments-eng
    enabled: true
  C0597404MS6:                 # payments-pr-review
    enabled: true

# Channels in this list never trigger graph injection.
denylist:
  - C_GENERAL_NOISE_CHANNEL
